[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-maker-os"
version = "0.1.0"
description = "Research-model gates and manuscript auditing for governed AI-assisted thesis work"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kirch-Nairu" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pypdf>=5.0"]
docx = ["python-docx>=1.1"]

[project.scripts]
thesis-os = "thesis_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
